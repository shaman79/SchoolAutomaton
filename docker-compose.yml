# SchoolAutomaton — full stack. `docker compose up --build` brings up backend + frontend(nginx).
# SQLite DB and the content-hashed visual cache live on the named volume `sa-data` (survives redeploys).
# Project name is pinned so the volume is always `schoolautomaton_sa-data` regardless of folder name.
# Deploys/updates go through infra/scripts/{deploy,update}.sh (health-gated, roll back to :previous).
name: schoolautomaton

# Bounded container logs (json-file default is unbounded and can fill the disk).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    image: schoolautomaton-backend:latest
    env_file: .env
    environment:
      SA_ENV: production
      SA_DATABASE_URL: sqlite+aiosqlite:////app/data/schoolautomaton.db
      SA_DATA_DIR: /app/data
      # Public origin(s) the browser uses (your Cloudflare hostname). Same-origin via nginx means
      # CORS is mostly moot, but keep it correct. Override in .env.
      SA_CORS_ORIGINS: ${SA_CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - sa-data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    # Runs as the non-root `appuser` (uid 1000, see Dockerfile.backend); never gains privileges.
    security_opt:
      - no-new-privileges:true
    # Let in-flight requests finish on a redeploy before SIGKILL (default is 10 s).
    stop_grace_period: 30s
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/healthz'); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    image: schoolautomaton-frontend:latest
    depends_on:
      backend:
        condition: service_started
    # Published host port is configurable via .env. Bound to 127.0.0.1 by default so only the
    # local host (and the Cloudflare tunnel running on this machine) can reach it — set
    # SA_HTTP_BIND=0.0.0.0 for direct LAN/public access without a tunnel.
    ports:
      - "${SA_HTTP_BIND:-127.0.0.1}:${SA_HTTP_PORT:-8080}:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  sa-data:
