# Installed as /etc/nginx/conf.d/default.conf (inside the stock http {} block).
# Security headers live in /etc/nginx/snippets/security-headers.conf (infra/nginx-security-headers.conf)
# and are included in EVERY location — see that file for why. Keep doing that for new locations.

# Re-resolve the backend through Docker's embedded DNS. A plain `proxy_pass http://backend:8000`
# is resolved once at startup, so after `compose up` recreates the backend (new IP) nginx kept
# proxying to a dead address until it was restarted. With a variable in proxy_pass nginx resolves
# at request time (cached for `valid`), and it also starts when the backend isn't up yet.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # No URI part on purpose: `proxy_pass $sa_backend;` then forwards the client's original request
    # URI unchanged, exactly like the previous `proxy_pass http://backend:8000;` did.
    set $sa_backend http://backend:8000;

    # Proxy settings shared by every proxied location (inherited: no location overrides them).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The backend sets its own copies of these; hide them so each header is sent once, from the
    # snippet, with the same values as the rest of the site.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Permissions-Policy;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # For responses produced at server level (e.g. error pages).
    include /etc/nginx/snippets/security-headers.conf;

    # Hashed build assets are immutable. (No `always`: a 404 for a missing asset must not be
    # cached for a year.)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The SPA shell must be revalidated on every load so a deploy is picked up at once (it names
    # the new hashed assets). `/` (index) and the history fallback below are internal redirects
    # to /index.html, so they land here too.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # API -> backend (includes the deploy health check /api/v1/health).
    location /api/ {
        proxy_pass $sa_backend;
        include /etc/nginx/snippets/security-headers.conf;

        # SSE generation stream (/api/v1/requests/{id}/stream) needs buffering OFF and long read
        # timeouts; sse-starlette also sends `X-Accel-Buffering: no`.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Backend liveness. Without this it fell through to the SPA and answered index.html with 200
    # even when the backend was down.
    location = /healthz {
        proxy_pass $sa_backend;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /openapi.json {
        proxy_pass $sa_backend;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA history fallback + other static files (favicon, manifest, icons).
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
