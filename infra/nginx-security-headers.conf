# Security headers — included in EVERY location of infra/nginx.conf.
#
# Why a snippet: nginx's add_header is all-or-nothing per level. A location that sets any
# add_header of its own (e.g. Cache-Control) silently drops every add_header inherited from the
# server block, so headers declared once at server level do not reach those locations. Each
# location therefore includes this file next to its own headers.
#
# CSP notes:
#   font-src data:  Vite inlines small font files (KaTeX_Size3 woff2, < 4 KB) as data: URIs in the
#                   CSS bundle; without it KaTeX renders some delimiters in a fallback font.
#   img-src/media-src  Replicate-hosted illustrations/videos.
#   style-src 'unsafe-inline'  Vue style bindings and KaTeX inline styles.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://replicate.delivery https://*.replicate.com; media-src 'self' https://replicate.delivery; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# microphone=(self): voice input in the prompt box (Web Speech API, useVoiceInput.ts).
# Read-aloud (speechSynthesis) and clipboard copy need no permission entry.
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), midi=(), payment=(), usb=()" always;
