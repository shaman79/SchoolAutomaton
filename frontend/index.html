<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile-first: device width baseline, user-zoom allowed (a11y). No viewport-fit=cover: it opts
         the page into edge-to-edge drawing, where the safe-area insets change while scrolling and
         when the keyboard opens, and both Chrome and Safari then shifted the page under the
         learner's finger (taps landed above or below the button that was drawn). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <meta name="theme-color" content="#6c4cff" />
    <meta name="description" content="SchoolAutomaton — learn anything, your way. Playful, visual study materials and tests." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SchoolAutomaton · Learn anything, your way</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
